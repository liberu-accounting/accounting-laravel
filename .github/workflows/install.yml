name: Install

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo, pdo_sqlite, sqlite3, mysql, dom, curl, intl, gd

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # §6.2: local path repositories are Composer output that happens to be tracked.
      # A clean install must reproduce those sources byte for byte. Other module and
      # theme directories are installed from their remote Composer repositories and
      # are generated output, so their release contents may legitimately differ.
      - name: Installed packages match the tracked source
        run: |
          path_packages="$(php -r '$composer=json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($composer["repositories"] as $repository) { if (($repository["type"] ?? null) === "path") { echo $repository["url"]." "; } }')"
          if ! git diff --exit-code --stat -- $path_packages; then
            echo "::error::A clean install rewrote a tracked Composer path repository."
            echo "Edit the package source in its path repository and keep the install reproducible."
            exit 1
          fi

      - name: Copy environment file
        run: cp .env.testing .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations (SQLite)
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Install npm dependencies
        run: npm ci

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend assets
        run: npm run build
